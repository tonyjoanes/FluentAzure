name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]  # Trigger on version tags for releases
  pull_request:
    branches: [ main ]

# Set permissions for the entire workflow
permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write
  actions: read

env:
  # The library and tests target net8.0 and net10.0, so both SDKs/runtimes are installed
  DOTNET_VERSION: |
    8.0.x
    10.0.x
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: false
  DOTNET_MULTILEVEL_LOOKUP: 0

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    # Checkout code with full history for MinVer to work properly
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0  # Full history needed for MinVer to determine version from Git tags

    # Setup .NET SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # Cache NuGet packages for faster builds
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    # Restore dependencies
    - name: Restore dependencies
      run: dotnet restore

    # Build solution with version information
    - name: Build solution
      run: dotnet build --no-restore --configuration Release
      env:
        # Set CI environment for deterministic builds
        CI: true

    # Run tests with coverage collection
    - name: Run tests with coverage
      run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

    # Publish the Native AOT example and fail on any trimming/AOT warning, then run the native binary
    - name: Native AOT compatibility check
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        dotnet publish examples/Aot.Example -c Release -r linux-x64 2>&1 | tee aot-publish.log
        if grep -E "warning IL[0-9]+" aot-publish.log; then
          echo "::error::Trimming/Native AOT warnings found"
          exit 1
        fi
        ./examples/Aot.Example/bin/Release/net10.0/linux-x64/publish/Aot.Example

    # Upload coverage reports to Codecov (Ubuntu only to avoid duplicates)
    - name: Upload coverage reports to Codecov
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v5
      with:
        directory: ./coverage
        fail_ci_if_error: true
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  emulator-tests:
    name: App Configuration Emulator Tests
    runs-on: ubuntu-latest

    # Real App Configuration API semantics (labels, feature flags, sentinel refresh) via the official emulator.
    # Connection-string requests are HMAC-signed, so the emulator is given a matching access key.
    services:
      appconfig:
        image: mcr.microsoft.com/azure-app-configuration/app-configuration-emulator:1.2.0
        ports:
          - 8483:8483
        env:
          Tenant__HmacSha256Enabled: 'true'
          Tenant__AccessKeys__0__Id: emulator
          Tenant__AccessKeys__0__Secret: c2VjcmV0

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Build tests
      run: dotnet build tests/FluentAzure.Tests --configuration Release

    - name: Wait for emulator
      shell: bash
      run: |
        for i in $(seq 1 30); do
          curl -s -o /dev/null http://localhost:8483/ && exit 0
          sleep 2
        done
        echo "::error::App Configuration emulator did not start"
        exit 1

    # Fail if the tests were skipped (e.g. the connection string was not passed through)
    - name: Run emulator tests
      shell: bash
      env:
        FLUENTAZURE_APPCONFIG_EMULATOR: Endpoint=http://localhost:8483;Id=emulator;Secret=c2VjcmV0
      run: |
        dotnet test tests/FluentAzure.Tests --no-build --configuration Release --filter "Category=Emulator" 2>&1 | tee emulator-tests.log
        if grep -qE "Skipped:\s+[1-9]" emulator-tests.log || ! grep -qE "Passed:\s+[1-9]" emulator-tests.log; then
          echo "::error::Emulator tests were skipped or did not run"
          exit 1
        fi

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    # Checkout code
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    # Setup .NET SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # Cache NuGet packages
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    # Restore dependencies
    - name: Restore dependencies
      run: dotnet restore

    # Run security audit to check for vulnerable packages
    - name: Run security audit
      run: dotnet list package --vulnerable --include-transitive 2>&1 | tee security-audit.log

    # Check for vulnerabilities and fail if found
    - name: Check for vulnerabilities
      run: |
        if grep -q "has the following vulnerable packages" security-audit.log; then
          echo "❌ Vulnerable packages found!"
          cat security-audit.log
          exit 1
        else
          echo "✅ No vulnerable packages found"
        fi

    # Upload security audit results as artifact
    - name: Upload security audit results
      uses: actions/upload-artifact@v5
      if: always()
      with:
        name: security-audit-results
        path: security-audit.log

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    # Checkout code
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    # Setup .NET SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # Cache NuGet packages
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    # Restore dependencies
    - name: Restore dependencies
      run: dotnet restore

    # Build solution
    - name: Build solution
      run: dotnet build --no-restore --configuration Release

    # Check code formatting consistency (warn only, don't fail)
    - name: Check code formatting
      run: |
        dotnet format --verify-no-changes --verbosity normal || echo "⚠️ Formatting issues found but not blocking build"
      continue-on-error: true

    # Run static code analysis (warn only, don't fail)
    - name: Run static code analysis
      run: |
        dotnet build --configuration Release --verbosity normal /p:RunAnalyzersDuringBuild=true /p:TreatWarningsAsErrors=false /p:WarningsAsErrors="" /p:WarningsNotAsErrors="CS1591" || echo "⚠️ Static analysis issues found but not blocking build"
      continue-on-error: true

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
    # Checkout code with full history for MinVer
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0  # Full history needed for MinVer versioning

    # Setup .NET SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # Cache NuGet packages
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    # Restore dependencies
    - name: Restore dependencies
      run: dotnet restore

    # Build solution with version information
    - name: Build solution
      run: dotnet build --no-restore --configuration Release
      env:
        CI: true

    # Create NuGet package with automatic versioning
    - name: Create NuGet package
      run: dotnet pack src/FluentAzure/FluentAzure.csproj --no-build --configuration Release --output ./packages

    # Display version information for debugging
    - name: Display version information
      run: |
        echo "Git tag: ${{ github.ref }}"
        echo "Package files created:"
        ls -la ./packages/*.nupkg || echo "No packages found"

    # Upload package artifacts for manual inspection
    - name: Upload package artifacts
      uses: actions/upload-artifact@v5
      with:
        name: nuget-packages
        path: ./packages/*.nupkg

  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: [package]
    if: startsWith(github.ref, 'refs/tags/v')  # Only publish on version tags

    steps:
    # Checkout code
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    # Setup .NET SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # Cache NuGet packages
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    # Restore dependencies
    - name: Restore dependencies
      run: dotnet restore

    # Build solution
    - name: Build solution
      run: dotnet build --no-restore --configuration Release
      env:
        CI: true

    # Create NuGet package
    - name: Create NuGet package
      run: dotnet pack src/FluentAzure/FluentAzure.csproj --no-build --configuration Release --output ./packages

    # Display version information
    - name: Display version information
      run: |
        echo "Publishing version from tag: ${{ github.ref }}"
        echo "Package files:"
        ls -la ./packages/*.nupkg

    # Publish to NuGet.org
    - name: Publish to NuGet.org
      run: |
        # Only publish the FluentAzure package
        for package in ./packages/FluentAzure.*.nupkg; do
          if [ -f "$package" ]; then
            echo "Publishing $package to NuGet.org..."
            dotnet nuget push "$package" \
              --source https://api.nuget.org/v3/index.json \
              --api-key ${{ secrets.NUGET_API_KEY }} \
              --skip-duplicate
          else
            echo "No FluentAzure package found to publish"
            exit 1
          fi
        done
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    # Create GitHub release using official action
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ github.ref_name }}
        body: |
          ## What's Changed

          This release includes the latest updates and improvements.

          ### Version
          ${{ github.ref_name }}

          ### Downloads
          NuGet packages are available on [NuGet.org](https://www.nuget.org/packages/FluentAzure)
        draft: false
        prerelease: true
      continue-on-error: true
